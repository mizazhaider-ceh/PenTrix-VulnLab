<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Nunito,'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B7CF6"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#F4F1FA"/>
  <circle cx="1100" cy="80" r="90" fill="#FBCFE8" opacity="0.45"/>
  <circle cx="90" cy="500" r="80" fill="#BAE6FD" opacity="0.45"/>
  <text x="60" y="58" font-size="30" font-weight="800" fill="#332F3A">How the lab is built</text>
  <text x="60" y="88" font-size="19" fill="#635F69">Express + SQLite. No build step, no framework lock-in. Every challenge is its own file.</text>

  <g font-size="19" font-weight="700" text-anchor="middle">
    <rect x="60" y="140" width="200" height="110" rx="24" fill="#ffffff" stroke="#E4E0F2" stroke-width="2"/>
    <circle cx="160" cy="172" r="16" fill="#0EA5E9"/>
    <text x="160" y="178" font-size="18" fill="#ffffff">◉</text>
    <text x="160" y="214" fill="#332F3A">Student browser</text>
    <text x="160" y="238" font-size="15" font-weight="600" fill="#635F69">real tools: curl, Burp</text>

    <rect x="320" y="140" width="200" height="110" rx="24" fill="#ffffff" stroke="#E4E0F2" stroke-width="2"/>
    <circle cx="420" cy="172" r="16" fill="#7C3AED"/>
    <text x="420" y="178" font-size="18" fill="#ffffff">⚙</text>
    <text x="420" y="214" fill="#332F3A">Express app.js</text>
    <text x="420" y="238" font-size="15" font-weight="600" fill="#635F69">sessions, static, API</text>

    <rect x="580" y="140" width="200" height="110" rx="24" fill="#ffffff" stroke="#E4E0F2" stroke-width="2"/>
    <circle cx="680" cy="172" r="16" fill="#DB2777"/>
    <text x="680" y="178" font-size="18" fill="#ffffff">▦</text>
    <text x="680" y="214" fill="#332F3A">29 module routers</text>
    <text x="680" y="238" font-size="15" font-weight="600" fill="#635F69">/sqli, /xss, /idor…</text>

    <rect x="840" y="140" width="300" height="110" rx="24" fill="#ffffff" stroke="#E4E0F2" stroke-width="2"/>
    <circle cx="990" cy="172" r="16" fill="#F59E0B"/>
    <text x="990" y="178" font-size="18" fill="#ffffff">✦</text>
    <text x="990" y="214" fill="#332F3A">201 challenge pages</text>
    <text x="990" y="238" font-size="15" font-weight="600" fill="#635F69">one file each, real-app feel</text>
  </g>
  <g stroke="#8B7CF6" stroke-width="3" fill="none" marker-end="url(#arr)">
    <line x1="260" y1="195" x2="312" y2="195"/>
    <line x1="520" y1="195" x2="572" y2="195"/>
    <line x1="780" y1="195" x2="832" y2="195"/>
  </g>

  <g font-size="19" font-weight="700" text-anchor="middle">
    <rect x="320" y="330" width="260" height="120" rx="24" fill="#ffffff" stroke="#E4E0F2" stroke-width="2"/>
    <circle cx="450" cy="362" r="16" fill="#10B981"/>
    <text x="450" y="368" font-size="18" fill="#ffffff">✓</text>
    <text x="450" y="404" fill="#332F3A">lib/flags.js</text>
    <text x="450" y="428" font-size="15" font-weight="600" fill="#635F69">award() verifies the exploit</text>

    <rect x="640" y="330" width="260" height="120" rx="24" fill="#ffffff" stroke="#E4E0F2" stroke-width="2"/>
    <circle cx="770" cy="362" r="16" fill="#7C3AED"/>
    <text x="770" y="368" font-size="18" fill="#ffffff">▤</text>
    <text x="770" y="404" fill="#332F3A">Per-install flags</text>
    <text x="770" y="428" font-size="15" font-weight="600" fill="#635F69">random, never in source</text>

    <rect x="960" y="330" width="180" height="120" rx="24" fill="#ffffff" stroke="#E4E0F2" stroke-width="2"/>
    <circle cx="1050" cy="362" r="16" fill="#DB2777"/>
    <text x="1050" y="368" font-size="18" fill="#ffffff">★</text>
    <text x="1050" y="404" fill="#332F3A">Scoreboard</text>
    <text x="1050" y="428" font-size="15" font-weight="600" fill="#635F69">progress, never secrets</text>
  </g>
  <g stroke="#8B7CF6" stroke-width="3" fill="none" marker-end="url(#arr)">
    <path d="M 990 250 C 990 315, 450 315, 450 324"/>
    <line x1="580" y1="390" x2="632" y2="390"/>
    <line x1="900" y1="390" x2="952" y2="390"/>
  </g>
  <text x="60" y="510" font-size="18" fill="#635F69">Challenge code never touches flag values. The only path to a flag is a working exploit.</text>
</svg>

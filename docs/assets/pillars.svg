<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Nunito,'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="pEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="pViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="pPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EC4899"/><stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="28" fill="#F4F1FA"/>
  <circle cx="1050" cy="50" r="90" fill="#FBCFE8" opacity="0.5"/>
  <circle cx="90" cy="350" r="80" fill="#BAE6FD" opacity="0.5"/>
  <text x="60" y="62" font-size="30" font-weight="800" fill="#332F3A">The three pillars: what makes this the best lab in the field</text>

  <g>
    <rect x="60" y="100" width="340" height="240" rx="28" fill="#ffffff" stroke="#E4E0F2" stroke-width="2"/>
    <rect x="60" y="100" width="340" height="86" rx="28" fill="url(#pEmerald)"/>
    <rect x="60" y="158" width="340" height="28" fill="url(#pEmerald)"/>
    <circle cx="104" cy="143" r="22" fill="#ffffff" opacity="0.3"/>
    <text x="104" y="152" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="140" y="151" font-size="23" font-weight="800" fill="#ffffff">Break-then-fix</text>
    <text x="92" y="222" font-size="18" fill="#332F3A">Exploit the bug. Then patch</text>
    <text x="92" y="248" font-size="18" fill="#332F3A">the code yourself. The lab</text>
    <text x="92" y="274" font-size="18" fill="#332F3A">re-runs the exploit to prove</text>
    <text x="92" y="300" font-size="18" fill="#332F3A">your fix holds. Offense <tspan font-weight="800">and</tspan></text>
    <text x="92" y="326" font-size="18" fill="#332F3A">defense, in one place.</text>
  </g>

  <g>
    <rect x="430" y="100" width="340" height="240" rx="28" fill="#ffffff" stroke="#E4E0F2" stroke-width="2"/>
    <rect x="430" y="100" width="340" height="86" rx="28" fill="url(#pViolet)"/>
    <rect x="430" y="158" width="340" height="28" fill="url(#pViolet)"/>
    <circle cx="474" cy="143" r="22" fill="#ffffff" opacity="0.3"/>
    <text x="474" y="152" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">≫</text>
    <text x="510" y="151" font-size="23" font-weight="800" fill="#ffffff">Kill-chain scenarios</text>
    <text x="462" y="222" font-size="18" fill="#332F3A">Multi-stage attacks that tell</text>
    <text x="462" y="248" font-size="18" fill="#332F3A">one story: recon, exploit,</text>
    <text x="462" y="274" font-size="18" fill="#332F3A">pivot, escalate, exfiltrate.</text>
    <text x="462" y="300" font-size="18" fill="#332F3A">Learn how hackers actually</text>
    <text x="462" y="326" font-size="18" fill="#332F3A">think, end to end.</text>
  </g>

  <g>
    <rect x="800" y="100" width="340" height="240" rx="28" fill="#ffffff" stroke="#E4E0F2" stroke-width="2"/>
    <rect x="800" y="100" width="340" height="86" rx="28" fill="url(#pPink)"/>
    <rect x="800" y="158" width="340" height="28" fill="url(#pPink)"/>
    <circle cx="844" cy="143" r="22" fill="#ffffff" opacity="0.3"/>
    <text x="844" y="152" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">★</text>
    <text x="880" y="151" font-size="23" font-weight="800" fill="#ffffff">Career paths</text>
    <text x="832" y="222" font-size="18" fill="#332F3A">"Zero to Web Pentester",</text>
    <text x="832" y="248" font-size="18" fill="#332F3A">"API Hacker", and more. Ordered</text>
    <text x="832" y="274" font-size="18" fill="#332F3A">challenges, prerequisites,</text>
    <text x="832" y="300" font-size="18" fill="#332F3A">skill tracking, and a verifiable</text>
    <text x="832" y="326" font-size="18" fill="#332F3A">certificate when you finish.</text>
  </g>
</svg>

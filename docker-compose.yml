services:
  vulnlab:
    build: .
    # Bind to localhost only: this app is intentionally vulnerable and must
    # never be exposed to a LAN or the internet. Override only for an
    # isolated lab network you fully control.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      # No SESSION_SECRET is set here on purpose: on first boot the app
      # generates a random one and persists it in the data volume
      # (data/.session-secret), so sessions survive restarts without any
      # secret ever being committed. Set one explicitly only if you need to
      # pin it (for example behind a load balancer).
      # - SESSION_SECRET=change-me-to-something-private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

services:
  vulnlab:
    build: .
    # Bind to localhost only: this app is intentionally vulnerable and must
    # never be exposed to a LAN or the internet. Override only for an
    # isolated lab network you fully control.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      # Set a private value for any graded or shared use. The app falls back
      # to an insecure dev secret when this is unset (see app.js).
      # - SESSION_SECRET=change-me-to-something-private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
